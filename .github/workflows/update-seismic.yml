name: Update seismic data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/1 * * * *"

permissions:
  contents: write

concurrency:
  group: seismic-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deprem

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Signal engine self-test
        run: node scripts/self-test.mjs

      - name: Fetch Kandilli + USGS and update archive
        run: node scripts/update-data.mjs

      - name: Commit data changes
        run: |
          git config user.name "seismic-watch-bot"
          git config user.email "seismic-watch-bot@users.noreply.github.com"
          git add data/current.json data/analysis.json data/archive

          if git diff --cached --quiet; then
            echo "No seismic changes"
          else
            git commit -m "data: update seismic feed"
            git push
          fi
