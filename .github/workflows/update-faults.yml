name: Refresh GEM fault layer
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch GEM Active Faults and clip Marmara subset
        run: node scripts/update-faults.mjs
      - name: Commit fault layer
        run: |
          git config user.name "seismic-watch-bot"
          git config user.email "seismic-watch-bot@users.noreply.github.com"
          git add data/faults.geojson
          if git diff --cached --quiet; then
            echo "No fault changes"
          else
            git commit -m "data: refresh GEM fault layer"
            git push
          fi
