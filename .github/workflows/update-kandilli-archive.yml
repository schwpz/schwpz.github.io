name: Update Kandilli archive

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: write

concurrency:
  group: kandilli-archive
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deprem

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Signal engine self-test
        run: node scripts/self-test.mjs

      - name: Fetch last 1000 Kandilli events, archive and analyze
        run: node scripts/update-kandilli.mjs

      - name: Commit data changes
        run: |
          git config user.name "seismic-watch-bot"
          git config user.email "seismic-watch-bot@users.noreply.github.com"
          git add data/archive data/history-marmara.json data/live-fallback.json data/analysis.json

          if git diff --cached --quiet; then
            echo "No Kandilli catalog changes"
          else
            git commit -m "data: update Kandilli archive"
            git push
          fi
